<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Demo App - Protected by AaaS</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen p-6 flex flex-col items-center">
  <div class="max-w-2xl w-full space-y-6">
    <!-- Header -->
    <div class="flex items-center justify-between bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-xl">
      <div>
        <h1 class="text-xl font-bold tracking-tight text-white">Client Web App</h1>
        <p class="text-xs text-slate-400">Secured with <code>@aaas/sdk</code> Express Middleware</p>
      </div>
      <div id="auth-header-btn">
        <button onclick="login()" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-500 text-white rounded-xl text-xs font-semibold shadow-lg shadow-indigo-600/30 transition">
          Sign In with AaaS &rarr;
        </button>
      </div>
    </div>

    <!-- User Status Banner -->
    <div id="user-banner" class="hidden bg-slate-900 border border-slate-800 rounded-2xl p-5 shadow-xl flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <img id="user-avatar" class="w-10 h-10 rounded-full border border-slate-700 bg-slate-800" src="" alt="">
        <div>
          <div class="text-sm font-semibold text-white flex items-center space-x-2">
            <span id="user-name">User Name</span>
            <span id="user-role-badge" class="px-2 py-0.5 rounded text-[10px] font-mono uppercase bg-indigo-950 text-indigo-300 border border-indigo-800">
              user
            </span>
          </div>
          <div id="user-email" class="text-xs text-slate-400 font-mono">user@example.com</div>
        </div>
      </div>
      <button onclick="logout()" class="px-3 py-1.5 text-xs text-slate-400 hover:text-white bg-slate-800 hover:bg-slate-700 border border-slate-700 rounded-lg transition">
        Sign Out
      </button>
    </div>

    <!-- Interactive API Playground -->
    <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-xl space-y-4">
      <h2 class="text-sm font-semibold text-white uppercase tracking-wider text-slate-400">Test Protected Endpoints</h2>
      <p class="text-xs text-slate-400">
        Click the buttons below to test how the Express server enforces RBAC based on the AaaS token in your browser:
      </p>

      <div class="grid grid-cols-3 gap-3">
        <button onclick="testApi('/api/public')"
                class="p-3 bg-slate-800 hover:bg-slate-700/80 border border-slate-700 rounded-xl text-left transition">
          <div class="text-xs font-semibold text-emerald-400">GET /api/public</div>
          <div class="text-[11px] text-slate-400 mt-1">Open to anyone</div>
        </button>

        <button onclick="testApi('/api/profile')"
                class="p-3 bg-slate-800 hover:bg-slate-700/80 border border-slate-700 rounded-xl text-left transition">
          <div class="text-xs font-semibold text-indigo-400">GET /api/profile</div>
          <div class="text-[11px] text-slate-400 mt-1">Any valid user</div>
        </button>

        <button onclick="testApi('/api/admin')"
                class="p-3 bg-slate-800 hover:bg-slate-700/80 border border-slate-700 rounded-xl text-left transition">
          <div class="text-xs font-semibold text-amber-400">GET /api/admin</div>
          <div class="text-[11px] text-slate-400 mt-1">Role 'admin' only</div>
        </button>
      </div>

      <!-- Result Box -->
      <div class="mt-4">
        <div class="text-xs text-slate-400 mb-1 flex items-center justify-between">
          <span>Server Response:</span>
          <span id="response-status" class="font-mono text-[11px]">Idle</span>
        </div>
        <pre id="response-output" class="bg-slate-950 p-4 rounded-xl text-xs font-mono text-slate-300 border border-slate-800/80 overflow-x-auto min-h-[100px]">Click an endpoint above to see the response.</pre>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
